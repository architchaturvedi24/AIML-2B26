<!DOCTYPE html>
<html>
<head>
    <title>Delete Properties</title>
</head>
<body>

    <script>
        class Student {
            constructor(name, rollno, city) {
                this.name = name;
                this.rollno = rollno;
                this.city = city;
            }
        }

        let s1 = new Student("Archit", 101, "Delhi");

        // Before deleting
        console.log(s1);

        // Delete name property
        delete s1.name;

        // After deleting
        console.log(s1);
    </script>

</body>
</html>
