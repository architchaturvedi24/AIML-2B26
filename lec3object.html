<!-- Small code  -->

<!DOCTYPE html>
<html>
<head>
    <title>Array Operations</title>
</head>

<body>

    <h1>JavaScript Array Operations</h1>

    <p id="output"></p>

    <script>
        let arr = [10, 20, 30, 40, 50];
        let result = "";
        result += "Original Array: " + arr + "<br><br>";
        // PUSH
        arr.push(60);
        result += "After push(60): " + arr + "<br>";
        // POP
        arr.pop();
        result += "After pop(): " + arr + "<br>";
        // UNSHIFT
        arr.unshift(5);
        result += "After unshift(5): " + arr + "<br>";
        // SHIFT
        arr.shift();
        result += "After shift(): " + arr + "<br>";
        // SPLICE
        arr.splice(2, 0, 25);
        result += "After splice(2, 0, 25): " + arr + "<br>";
        // SLICE
        let slicedArray = arr.slice(1, 4);
        result += "After slice(1, 4): " + slicedArray + "<br>";
        // SPLIT
        let str = "Apple,Banana,Mango,Orange";
        let splitArray = str.split(",");

        result += "Original String: " + str + "<br>";
        result += "After split(','): " + splitArray;
        // Display Output
        document.getElementById("output").innerHTML = result;

    </script>

</body>
</html>
