<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>

<body>

    <h1>REGISTRATION</h1>

    <div>
        <form action="" id="Registration" onsubmit="return validate()">

            <input type="text" id="uname" placeholder="Enter Name">
            <br><br>

            <input type="tel" id="num" placeholder="Enter Phone Number">
            <br><br>

            <input type="email" id="email" placeholder="Enter Email">
            <br><br>

            <input type="password" id="pass" placeholder="Enter Password">
            <br><br>

            <input type="password" id="repass" placeholder="Confirm Password">
            <br><br>

            <input type="submit" id="submit" value="Submit">

        </form>
    </div>

    <script>

        function validate() {

            let n = document.getElementById("uname").value;
            let num = document.getElementById("num").value;
            let email = document.getElementById("email").value;
            let pass = document.getElementById("pass").value;
            let repass = document.getElementById("repass").value;

            // Name validation
            if (n == "") {
                alert("Please fill your Name");
                return false;
            }

            // Phone validation
            if (num == "") {
                alert("Please fill your Phone Number");
                return false;
            }

            // Email validation
            if (email == "") {
                alert("Please fill your Email");
                return false;
            }

            // Password validation
            if (pass == "") {
                alert("Please enter Password");
                return false;
            }

            // Confirm password
            if (repass == "") {
                alert("Please confirm your Password");
                return false;
            }

            // Check passwords
            if (pass != repass) {
                alert("Passwords do not match");
                return false;
            }

            alert("Registration Successful!");
            return true;
        }

    </script>
</body>

</html>
