<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor</title>
</head>
<body>
    <h1> Constructor Static Function and Keyword</h1>
    <script>
        class student{
         static  firstname = "Archit";
         static  lastname = "Chaturvedi";
             display()
            {
                console.log(student.firstname);
                console.log(student.lastname);

            }
        }
       //  student.display();
       let s1 = new student();
     s1.display();

    </script>
</body>
</html>
