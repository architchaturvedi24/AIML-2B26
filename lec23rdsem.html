<!DOCTYPE html>
<html>
<head>
    <title>Age Checker</title>
</head>
<body>

    <h2>Age Checker</h2>

    Enter Age:
    <input type="number" id="age">

    <button onclick="checkAge()">Check</button>

    <script>
        function checkAge() {
            let age = document.getElementById("age").value;

            if (age >= 18) {
                alert("You are an Adult.");
            } else {
                alert("You are a Minor.");
            }
        }
    </script>

</body>
</html>
