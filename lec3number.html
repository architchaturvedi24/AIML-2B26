<!DOCTYPE html>
<html>
<head>
    <title>Number Operations</title>
</head>

<body>

    <h1>Number Operations</h1>
    <p id="output"></p>

    <script>
        let num = 25.5678;
        document.getElementById("output").innerHTML =
            "Number: " + Number(num) + "<br>" +
            "parseInt: " + parseInt(num) + "<br>" +
            "parseFloat: " + parseFloat(num) + "<br>" +
            "toFixed(2): " + num.toFixed(2) + "<br>" +
            "isNaN: " + isNaN(num) + "<br>" +
            "isInteger: " + Number.isInteger(num);

    </script>
</body>
</html>
